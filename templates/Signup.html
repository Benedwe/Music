<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - MelodyMix</title>
    <link rel="stylesheet" href="signup.css" />
</head>
<body>
    <header>
        MelodyMix
    </header>
    <main>
        <section class="signup-box">
            <h2>Create Your MelodyMix Account</h2>
            <p>Signup to MelodyMix and enjoy world-class music</p>

            <h3>Continue with Spotify</h3>
            <p>Sign up and log in using your Spotify account</p>
            
            <!-- Spotify Login Button -->
            <a href="/spotify-login" class="spotify-login">
                <button type="button" class="spotify">
                    <img src="/static/images/spotify-icon.png" alt="Spotify Icon" />
                    Continue with Spotify
                </button>
            </a>

            <!-- Login Link -->
            <p class="login-link">Already have an account? <a href="/login">Login here</a></p>
        </section>
    </main>
</body>
</html>
