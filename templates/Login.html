<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MelodyMix</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body>
    <header>
        MelodyMix
    </header>
    <main>
        <section class="login-box">
            <h2>Welcome Back to MelodyMix</h2>
            <p>Login to access your playlists and favorite music</p>

            <!-- Spotify Login Button -->
            <a href="/spotify-login" class="spotify-login">
                <button type="button" class="spotify">
                    <img src="/static/images/spotify-icon.png" alt="Spotify Icon" />
                    Continue with Spotify
                </button>
            </a>

            <!-- Signup Link -->
            <p class="signup-link">Don't have an account? <a href="/signup">Sign up here</a></p>
        </section>
    </main>
</body>
</html>
